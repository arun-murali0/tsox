name: CI

# Branches (everything except main and merge-tmp/*): fmt + test via scripts/ci.sh.
# merge-tmp/* (staging branches made by auto-merge.yml): the compare-against-tsc gate.
# main: nothing runs, because only code that already passed both gates reaches it.

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTFLAGS: "-D warnings"
  # Keep equal to rust-version in Cargo.toml.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  # Branch gate: fmt + test.
  all-green:
    name: All green
    # Not on staging branches, and not on same-repo PRs (the push run covers them).
    if: ${{ !startsWith(github.ref, 'refs/heads/merge-tmp/') && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: fmt + test
        run: bash ./scripts/ci.sh

  # Staging gate: tsox vs real tsc over tests/fixtures, gated by the baseline.
  # Runs once per merge into main, never per branch push.
  compare-tsc:
    name: Compare against real tsc
    if: ${{ startsWith(github.ref, 'refs/heads/merge-tmp/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-drift

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/ts-diag-tool/package-lock.json

      - name: Build tsox (release)
        run: cargo build --locked --release --bin tsox

      - name: Install ts-diag-tool dependencies
        working-directory: scripts/ts-diag-tool
        run: npm ci

      # tsc is the slow part (minutes over the whole suite) and its answer for a fixture only
      # changes when that fixture changes. The cache is filled by tsc-cache.yml on main;
      # a merge-tmp/* branch can only read caches from main, so this job only restores.
      # See check-fixtures.js for how an entry is judged still valid.
      - name: Restore tsc result cache
        uses: actions/cache/restore@v4
        with:
          path: scripts/ts-diag-tool/.tsc-cache.json
          key: tsc-diag-${{ hashFiles('scripts/ts-diag-tool/package-lock.json', 'scripts/ts-diag-tool/check-fixtures.js') }}-${{ github.sha }}
          restore-keys: |
            tsc-diag-${{ hashFiles('scripts/ts-diag-tool/package-lock.json', 'scripts/ts-diag-tool/check-fixtures.js') }}-

      - name: Compare tsox against real tsc over tests/fixtures
        run: |
          node scripts/ts-diag-tool/compare.js tests/fixtures target/release/tsox --json --differ --only-differ \
            > /tmp/tsc-drift-result.json

      - name: Enforce known-differences baseline
        run: node scripts/ts-diag-tool/check-baseline.js < /tmp/tsc-drift-result.json

      # The differences are the list of what is not compatible with tsc yet. They are kept as
      # a run artifact and a job summary instead of a branch, so nothing has to be committed
      # to see the remaining work. always(): the list is most useful when the gate failed.
      - name: Summarize differences from tsc
        if: ${{ always() }}
        run: |
          node - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          let r;
          try { r = JSON.parse(fs.readFileSync("/tmp/tsc-drift-result.json", "utf8")); }
          catch { console.log("No compare result was produced."); process.exit(0); }
          const d = r.differences || [];
          const n = (k) => d.filter((x) => x.kind === k).length;
          console.log("## Differences from tsc\n");
          console.log(`${d.length} line(s): ${n("GAP")} gap, ${n("FALSE POSITIVE")} false positive, ${n("MISMATCH")} mismatch\n`);
          const byCode = new Map();
          for (const x of d.filter((x) => x.kind === "GAP"))
            for (const t of x.tsc) {
              const code = t.split(" ")[0];
              byCode.set(code, (byCode.get(code) || 0) + 1);
            }
          if (byCode.size) {
            console.log("| tsc code the checker misses | lines |\n|---|---|");
            for (const [code, c] of [...byCode].sort((a, b) => b[1] - a[1]))
              console.log(`| ${code} | ${c} |`);
          }
          for (const kind of ["FALSE POSITIVE", "MISMATCH", "GAP"]) {
            const list = d.filter((x) => x.kind === kind);
            if (!list.length) continue;
            console.log(`\n<details><summary>${kind} (${list.length})</summary>\n`);
            for (const x of list)
              console.log(`- \`${x.file}:${x.line}\` tsc: ${x.tsc.map((t) => t.split("\n")[0]).join("; ") || "-"} / tsox: ${x.tsox.map((t) => t.split("\n")[0]).join("; ") || "-"}`);
            console.log("\n</details>");
          }
          JS

      - name: Keep the differences as a run artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: differences-from-tsc
          path: /tmp/tsc-drift-result.json
          if-no-files-found: ignore
          retention-days: 30
