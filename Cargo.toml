[package]
name = "tsox"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "A Rust-based TypeScript type checker built on Oxc."
license = "MIT OR Apache-2.0"
repository = "https://github.com/arun-murali0/tsox"
readme = "README.md"
keywords = ["typescript", "type-checker", "compiler", "oxc", "wasm"]
categories = ["development-tools", "wasm"]
exclude = [
    "tests/",
    ".harness/",
    ".github/",
    ".githooks/",
    "scripts/harness.sh",
]

[lib]
name = "tsox"
crate-type = ["cdylib", "rlib"]

[lints.clippy]
collapsible_if = "allow"

[dependencies]
oxc_allocator = "=0.151.0"
oxc_ast = "=0.151.0"
oxc_ast_visit = "=0.151.0"
oxc_span = "=0.151.0"
oxc_parser = "=0.151.0"
thiserror = "2"
oxc_semantic = { version = "=0.151.0", features = ["cfg"] }
oxc_cfg      = "=0.151.0"
tracing = "0.1"
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
dhat = { version = "0.3", optional = true }
smallvec = "1.16"
oxc_resolver = { version = "=11.24.3", optional = true }
rayon = { version = "1.10", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
petgraph = { version = "=0.8.3", optional = true }
salsa = { version = "=0.28.5", optional = true }
bumpalo = { version = "=3.20.3", optional = true }
proc-macro2 = "1.0.107"
zmij = "1.0.23"

# The wasm build keeps the platform allocator, so mimalloc is not even resolved for it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "=0.1.52", optional = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
criterion = "0.8.2"
iai-callgrind = "0.16.1"

[[bin]]
name = "tsox"
path = "bin/tsox.rs"

[[bin]]
name = "compare-tsc"
path = "bin/compare-tsc.rs"

[[bench]]
name = "checker_benchmark"
harness = false

[[bench]]
name = "checker_iai"
harness = false

[[bench]]
name = "corpus_benchmark"
harness = false

[[bench]]
name = "corpus_iai"
harness = false

[[bench]]
name = "module_graph_benchmark"
harness = false
required-features = ["module-resolution"]

[[bench]]
name = "module_graph_iai"
harness = false
required-features = ["module-resolution"]

[[bench]]
name = "foundation_benchmark"
harness = false
required-features = ["module-resolution", "incremental", "scratchpad"]

[features]
default = ["module-resolution"]
wasm = [
    "dep:wasm-bindgen",
    "dep:serde",
    "dep:serde-wasm-bindgen",
    "dep:console_error_panic_hook",
]
dhat-heap = ["dep:dhat"]

# Project-level module resolution and the module graph. On by default since the checker
# is cross-file now. It reads the filesystem through oxc_resolver, so single-file,
# in-memory and wasm callers build with --no-default-features.
module-resolution = ["dep:oxc_resolver", "dep:rayon", "dep:petgraph"]

# Salsa inputs and memoized queries over project files. A shell around the checker for
# now; see docs/architecture/foundation-dependencies.md.
incremental = ["dep:salsa"]

# Worker-local bump allocation for scratch data that does not outlive a job.
scratchpad = ["dep:bumpalo"]

# mimalloc as the global allocator of the tsox binary. Off by default so the binary
# CI builds and compares against tsc does not change; release builds opt in.
mimalloc = ["dep:mimalloc"]

# Native build: what `cargo build --release` and the criterion / iai-callgrind
# benches (cargo's bench profile inherits release) measure. Speed matters here and
# binary size does not, so this is opt-level 3 with fat LTO and one codegen unit,
# which lets the small arena and subtyping helpers inline across modules. The
# previous "s" traded exactly that inlining for size, which was right for the wasm
# bundle but skewed every native measurement.
[profile.release]
# panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1

# The browser bundle keeps the size-first settings the release profile used to
# carry. A separate profile (rather than an override in release) is what lets the
# two builds differ. wasm-pack always passes --release, so it cannot select this;
# build with cargo and run wasm-bindgen on the result:
#   cargo build --profile wasm-release --lib --target wasm32-unknown-unknown --features wasm
#   wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/wasm-release/tsox.wasm
# Release speed with symbols kept, for heap and CPU profilers that need to name frames.
#   cargo run --profile profiling --features dhat-heap --example dhat_heap
# Add module-resolution to the features to include the multi-file project workloads.
[profile.profiling]
inherits = "release"
debug = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"

[workspace]
resolver = "2"
