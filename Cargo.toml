[package]
name = "tsox"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "A Rust-based TypeScript type checker built on Oxc."
license = "MIT OR Apache-2.0"
repository = "https://github.com/arun-murali0/tsox"
readme = "README.md"
keywords = ["typescript", "type-checker", "compiler", "oxc", "wasm"]
categories = ["development-tools", "wasm"]
exclude = [
    "tests/",
    ".harness/",
    ".github/",
    ".githooks/",
    "scripts/harness.sh",
]

[lib]
name = "tsox"

[lints]
workspace = true

[dependencies]
tsox-base = { workspace = true }
tsox-types = { workspace = true }
tsox-checker = { workspace = true }
tsox-project = { workspace = true, optional = true }
tsox-db = { workspace = true, optional = true }
# Only the example that dumps a control flow graph reads Oxc directly.
oxc_allocator = { workspace = true }
oxc_cfg = { workspace = true }
oxc_parser = { workspace = true }
oxc_semantic = { workspace = true }
oxc_span = { workspace = true }
tracing = { workspace = true }
dhat = { version = "0.3", optional = true }
# Kept by tests and benches that build a pool or a resolver of their own.
oxc_resolver = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
# Held at these versions; nothing in the workspace names them directly.
proc-macro2 = { workspace = true }
zmij = { workspace = true }


[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
criterion = "0.8.2"
iai-callgrind = "0.16.1"

[[bench]]
name = "checker_benchmark"
harness = false

[[bench]]
name = "checker_iai"
harness = false

[[bench]]
name = "corpus_benchmark"
harness = false

[[bench]]
name = "corpus_iai"
harness = false

[[bench]]
name = "module_graph_benchmark"
harness = false
required-features = ["module-resolution"]

[[bench]]
name = "module_graph_iai"
harness = false
required-features = ["module-resolution"]

[[bench]]
name = "foundation_benchmark"
harness = false
required-features = ["module-resolution", "incremental", "scratchpad"]

[[example]]
name = "incremental_baseline"
required-features = ["incremental"]

[features]
default = ["module-resolution"]
# Serialize and Deserialize on the diagnostic types. The wasm front end is the tsox-wasm
# crate; it turns this on through its dependency on this one.
wasm = ["tsox-base/wasm"]
# A byte form for a checked unit (`UnitSnapshot`), for caching bundled library files.
snapshot = ["tsox-checker/snapshot", "tsox-project?/snapshot"]
dhat-heap = ["dep:dhat"]

# Project-level module resolution and the module graph. On by default since the checker
# is cross-file now. It reads the filesystem through oxc_resolver, so single-file,
# in-memory and wasm callers build with --no-default-features.
module-resolution = ["dep:oxc_resolver", "dep:rayon", "dep:tsox-project"]

# Salsa inputs and memoized queries over project files. Off by default, so a normal build does not
# compile Salsa: the default CLI uses the full driver, and `--incremental` / `--watch` need this
# feature (without it they say so and stop). CI builds with --all-features, which includes it. See
# docs/architecture/foundation-dependencies.md.
incremental = ["dep:tsox-db", "module-resolution", "tsox-project/incremental"]

# Worker-local bump allocation for scratch data that does not outlive a job.
scratchpad = ["tsox-base/scratchpad"]

# (The `mimalloc` allocator feature belongs to the binary now: `-p tsox-cli --features mimalloc`.)

# Native build: what `cargo build --release` and the criterion / iai-callgrind
# benches (cargo's bench profile inherits release) measure. Speed matters here and
# binary size does not, so this is opt-level 3 with fat LTO and one codegen unit,
# which lets the small arena and subtyping helpers inline across modules. The
# previous "s" traded exactly that inlining for size, which was right for the wasm
# bundle but skewed every native measurement.
[profile.release]
# Keep unwinding. The project scheduler (module_resolution/schedule.rs) catches a panic in
# one unit so the files that import it still run, and an abort here would turn that one bad
# file into a dead process with no report.
# panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1

# The browser bundle keeps the size-first settings the release profile used to
# carry. A separate profile (rather than an override in release) is what lets the
# two builds differ. wasm-pack always passes --release, so it cannot select this;
# build with cargo and run wasm-bindgen on the result:
#   cargo build --profile wasm-release -p tsox-wasm --target wasm32-unknown-unknown
#   wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/wasm-release/tsox_wasm.wasm
# Release speed with symbols kept, for heap and CPU profilers that need to name frames.
#   cargo run --profile profiling --features dhat-heap --example dhat_heap
# Add module-resolution to the features to include the multi-file project workloads.
[profile.profiling]
inherits = "release"
debug = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"

[workspace]
resolver = "2"
members = ["crates/*"]
# What a bare `cargo build`, `cargo test` or `cargo build --bin tsox` selects: this package and
# the two front ends that carry the binaries (`tsox`, `harness`, `compare-tsc`). The wasm
# crate is not here; it needs a wasm target (see the wasm-release profile below).
default-members = [".", "crates/tsox-cli", "crates/tsox-xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arun-murali0/tsox"

[workspace.lints.clippy]
collapsible_if = "allow"

[workspace.dependencies]
oxc_allocator = "=0.158.0"
oxc_ast = "=0.158.0"
oxc_ast_visit = "=0.158.0"
oxc_span = "=0.158.0"
oxc_parser = "=0.158.0"
oxc_semantic = { version = "=0.158.0", features = ["cfg"] }
oxc_cfg = "=0.158.0"
oxc_resolver = "=11.24.3"
thiserror = "2"
tracing = "0.1"
smallvec = "1.16"
rayon = "1.10"
salsa = "=0.28.5"
bumpalo = "=3.20.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde = { version = "1", features = ["derive", "rc"] }
proc-macro2 = "1.0.107"
zmij = "1.0.23"
tsox-base = { path = "crates/tsox-base" }
tsox-types = { path = "crates/tsox-types" }
tsox-checker = { path = "crates/tsox-checker" }
tsox-project = { path = "crates/tsox-project" }
tsox-db = { path = "crates/tsox-db" }
