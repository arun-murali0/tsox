[package]
name = "tsox-xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Development tools: the real-project harness, the tsc conformance comparison, and `cargo xtask` (layering, owner map, corpus)."
publish = false

[lints]
workspace = true

# Two binaries, found in src/bin/: `harness` (compares tsox with tsc and tsgo on a real
# project; see scripts/harness.sh) and `compare-tsc` (in-process, errors-only comparison on
# tests/tsc-conformance). Both find the repository root from this crate's location.

[dependencies]
serde = { workspace = true }
serde_json = "1"
regex = "1"
# compare-tsc runs the checker in process; the harness only starts the `tsox` binary.
tsox = { path = "../..", default-features = false }
xxhash-rust = { workspace = true }
