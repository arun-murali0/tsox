[package]
name = "tsox-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The tsox browser front end (wasm-bindgen)."
publish = false

[lints]
workspace = true

# Build (see the wasm-release profile in the root Cargo.toml):
#   cargo build --profile wasm-release -p tsox-wasm --target wasm32-unknown-unknown
#   wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/wasm-release/tsox_wasm.wasm
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `wasm` turns on serde for the diagnostic types, which the front end serializes.
tsox = { path = "../..", default-features = false, features = ["wasm"] }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
